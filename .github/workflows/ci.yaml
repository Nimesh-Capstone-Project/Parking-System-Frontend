name: Frontend CI/CD

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      release_tag:
        description: Release tag in the format vX.Y.Z or frontend-vX.Y.Z
        required: true
        type: string

jobs:
  ci:
    if: github.event_name != 'workflow_dispatch'
    uses: Nimesh-Capstone-Project/Parking-System/.github/workflows/reusable-ci-frontend.yaml@master
    with:
      trigger_event: ${{ github.event_name }}
      source_sha: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
      service_name: frontend
      image_name: frontend
      helm_values_key: frontend
      dev_manifest_path: infra/argocd/dev/frontend.yaml
      sonar_key: Nimesh-Capstone-Project_Parking-System-Frontend_975eb784-0cc2-4d0d-b973-1c6a14a8397b
      docker_context: .
      dockerfile_path: ./Dockerfile
      working_directory: .
    secrets:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      SONAR_URL: ${{ secrets.SONAR_URL }}
      SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
      TOKEN: ${{ secrets.TOKEN }}
      EMAIL_USERNAME: ${{ secrets.EMAIL_USERNAME }}
      EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}

  release:
    if: github.event_name == 'workflow_dispatch'
    uses: Nimesh-Capstone-Project/Parking-System/.github/workflows/reusable-release.yaml@master
    with:
      release_tag: ${{ inputs.release_tag }}
      service_name: frontend
      image_name: frontend
      helm_values_key: frontend
      dev_manifest_path: infra/argocd/dev/frontend.yaml
      prod_manifest_path: infra/argocd/prod/frontend.yaml
    secrets:
      TOKEN: ${{ secrets.TOKEN }}
      EMAIL_USERNAME: ${{ secrets.EMAIL_USERNAME }}
      EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}